name: Backup Supabase

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump schema + data
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase db dump --project-ref bzodbqioldzdyupzoljx --schema public -f schema.sql
          npx supabase db dump --project-ref bzodbqioldzdyupzoljx --data-only -f data.sql
          gzip -9 -k schema.sql data.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: |
            schema.sql.gz
            data.sql.gz
          retention-days: 90
